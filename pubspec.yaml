name: host_babminton
description: "A new Flutter project."
publish_to: "none"

version: 1.1.4+15

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  get: ^4.6.6
  flutter_svg: ^2.2.3
  flutter_screenutil: ^5.9.3
  google_fonts: ^6.3.2
  shared_preferences: ^2.1.1
  go_router: ^15.0.1
  intl: ^0.19.0
  package_info_plus: ^8.0.0
  image_picker: ^1.2.2
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  path_provider: ^2.1.5
  share_plus: ^12.0.2
  screenshot: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  flutter_launcher_icons: "^0.14.4"
  build_runner: ^2.4.13
  isar_generator: ^3.1.0+1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/babminton.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/babminton.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/calendar/
    - assets/images/finance/
